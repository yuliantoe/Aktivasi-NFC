    <meta charset="UTF-8" />

    <script>
      (function() {
        var isExt = function(msg, stack, file) {
          var s = (String(msg || '') + ' ' + String(stack || '') + ' ' + String(file || '')).toLowerCase();
          return s.indexOf('metamask') !== -1 ||
                 s.indexOf('chrome-extension://') !== -1 ||
                 s.indexOf('inpage.js') !== -1 ||
                 s.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1;
        };
        window.addEventListener('error', function(e) {
          if (isExt(e.message, e.error && e.error.stack, e.filename)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          var msg = r ? (typeof r === 'string' ? r : (r.message || r.stack || '')) : '';
          if (isExt(msg, r && r.stack, '')) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          if (isExt(msg, err && err.stack, url)) return true;
          if (prevOnError) return prevOnError.apply(this, arguments);
        };
      })();
    </script>
